<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gestão de Equipe — Nômade</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>
</head>

<body>

  <div class="app-shell" id="app-shell">

    <div class="content">

      <!-- Cabeçalho da página -->
      <div class="page-head">

        <div>
          <h1>Gestão de Equipe</h1>

          <p>
            Gerencie o acesso de usuários, funções e permissões
            de segurança em todo o sistema de inventário.
          </p>
        </div>

        <button class="btn-accent" type="button" data-bs-toggle="modal" data-bs-target="#addUserModal">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
            <path d="M12 5v14M5 12h14" />
          </svg>

          Adicionar usuário
        </button>

      </div>


      <!-- Indicadores -->
      <div class="row g-3 mb-4">

        <div class="col-6 col-lg-3">
          <div class="metric-card">

            <div class="metric-label">
              Total de usuários
            </div>

            <div class="metric-value">
              0
            </div>

          </div>
        </div>

        <div class="col-6 col-lg-3">
          <div class="metric-card">

            <div class="metric-label">
              Ativos
            </div>

            <div class="metric-value" style="color: var(--success)">
              —
            </div>

          </div>
        </div>

      </div>


      <!-- Painel de usuários -->
      <div class="panel">

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">

          <div class="panel-title">
            Elenco da equipe
          </div>


          <!-- Pesquisa -->
          <div class="input-icon-wrap" style="width: 240px">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <circle cx="10.5" cy="10.5" r="6.5" />

              <path d="M20 20l-4.3-4.3" />
            </svg>

            <input class="form-control-app" id="userFilter" type="search" placeholder="Pesquisar membros da equipe...">

          </div>

        </div>


        <!-- Tabela -->
        <div class="table-responsive">

          <table class="table-app" id="userTable">

            <thead>
              <tr>
                <th>Usuário</th>
                <th>Função</th>
                <th>Setor</th>
                <th>Status</th>
                <th>Última atividade</th>
                <th></th>
              </tr>
            </thead>

            <tbody>

              <!--
                Os usuários serão inseridos
                automaticamente pelo integration.js
              -->

              <tr>
                <td colspan="6" class="cell-muted text-center">
                  Carregando usuários...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


  <!-- ========================================= -->
  <!-- MODAL: ADICIONAR USUÁRIO                  -->
  <!-- ========================================= -->

  <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content" style="
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
        ">

        <!-- Cabeçalho -->
        <div class="modal-header" style="border-color: var(--border)">

          <h5 class="modal-title font-display" id="addUserModalLabel">
            Adicionar usuário
          </h5>

          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>

        </div>


        <!-- Formulário -->
        <form id="addUserForm">

          <div class="modal-body">


            <!-- Nome -->
            <div class="mb-3">

              <label class="field-label" for="uNome">
                Nome completo
              </label>

              <input class="form-control-app" id="uNome" type="text" autocomplete="name" required>

            </div>


            <!-- E-mail -->
            <div class="mb-3">

              <label class="field-label" for="uEmail">
                E-mail
              </label>

              <input class="form-control-app" id="uEmail" type="email" autocomplete="email" required>

            </div>


            <!-- Senha -->
            <div class="mb-3">

              <label class="field-label" for="uSenha">
                Senha
              </label>

              <input class="form-control-app" id="uSenha" type="password" minlength="6" autocomplete="new-password"
                placeholder="Mínimo de 6 caracteres" required>

            </div>


            <!-- Função -->
            <div class="mb-3">

              <label class="field-label" for="uFuncao">
                Função
              </label>

              <select class="form-select-app" id="uFuncao" required>

                <option value="">
                  Selecione uma função
                </option>

                <option value="Gerente">
                  Gerente
                </option>

                <option value="Analista">
                  Analista
                </option>

                <option value="Operador">
                  Operador
                </option>

                <option value="Assistente">
                  Assistente
                </option>

              </select>

            </div>

          </div>


          <!-- Rodapé -->
          <div class="modal-footer" style="border-color: var(--border)">

            <button type="button" class="btn-ghost" data-bs-dismiss="modal">
              Cancelar
            </button>

            <button type="submit" class="btn-accent">
              Adicionar
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>


  <!-- Bootstrap -->
  <!-- =====================================================
       SCRIPTS
       ===================================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/layout/icons.js"></script>
  <script src="assets/js/layout/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/integration/core.js"></script>
  <script src="assets/js/integration/usuarios.js"></script>

</body>

</html>
