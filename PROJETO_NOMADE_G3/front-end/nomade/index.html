<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nômade — Entrar no sistema</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 21.5c5-1.5 9-4.6 11.3-9.3 1-2 3-6.7 5.2-8.7-2.7 3.8-3 8.4-1.2 11.7 1.4 2.6 4 4.2 7.2 3.9-3.7 2.8-8.7 3.3-12.9 1-1.7-.9-3-.9-4.7-.2-1.7.8-3.1 1.7-4.9 1.6z"/>
      </svg>
      <span>NÔMADE</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="field-label" for="email">Login</label>
        <div class="input-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6.5h18v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M3.5 7l8.5 6.5L20.5 7"/></svg>
          <input class="form-control-app" type="text" id="email" placeholder="Digite seu login" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="field-label" for="senha">Senha</label>
        <div class="input-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="9.5" rx="1.8"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
          <input class="form-control-app" type="password" id="senha" placeholder="••••••••" required minlength="6">
        </div>
      </div>

      <div class="mb-3">
        <label class="field-label" for="perfil">Perfil de sistema</label>
        <select class="form-select-app" id="perfil">
          <option>Gerente</option>
          <option>Analista</option>
          <option>Operador</option>
          <option>Somente visualização</option>
        </select>
      </div>

      <div class="login-foot">
        <label class="form-check-app m-0">
          <input type="checkbox" id="lembrar">
          Lembrar dispositivo
        </label>
        <a href="#" id="openRegister">Criar conta</a>
      </div>

      <p id="loginError" class="text-danger small mb-2"></p>
      <button type="submit" class="btn-accent w-100 justify-content-center">
        Entrar no sistema
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13.5 5.5 20 12l-6.5 6.5M4 12h15.5"/></svg>
      </button>
    </form>
  </div>
</div>

<!-- Modal de cadastro: o usuário cria sua própria conta antes de entrar -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg)">
      <div class="modal-header" style="border-color:var(--border)">
        <h5 class="modal-title font-display">Criar usuário</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="registerForm" novalidate>
        <div class="modal-body">
          <div id="registerMessage" class="small mb-3"></div>
          <div class="mb-3">
            <label class="field-label" for="registerNome">Nome completo</label>
            <input class="form-control-app" id="registerNome" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="field-label" for="registerLogin">Login / e-mail</label>
            <input class="form-control-app" id="registerLogin" maxlength="100" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="field-label" for="registerSenha">Senha</label>
              <input class="form-control-app" type="password" id="registerSenha" minlength="6" required>
            </div>
            <div class="col-md-6">
              <label class="field-label" for="registerConfirmar">Confirmar senha</label>
              <input class="form-control-app" type="password" id="registerConfirmar" minlength="6" required>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="field-label" for="registerCargo">Perfil</label>
              <select class="form-select-app" id="registerCargo">
                <option>Gerente</option>
                <option>Analista</option>
                <option selected>Operador</option>
                <option>Somente visualização</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="field-label" for="registerSetor">Setor</label>
              <input class="form-control-app" id="registerSetor" value="Estoque" maxlength="100" required>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-color:var(--border)">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-accent" id="registerButton">Cadastrar usuário</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/integration.js"></script>
</body>
</html>
